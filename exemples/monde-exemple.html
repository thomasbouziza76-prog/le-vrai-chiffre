<script>
/* ===================== kit glaçon (à copier) ===================== */
var GX_W = 1080, GX_H = 1920, GX_CX = 540, GX_CY = 960, FX_F = 1000;
function fxRad(d) { return d * Math.PI / 180; }
function fxToCam(c, p) {
  var x = p[0] - c.x, y = p[1] - c.y, z = p[2] - c.z;
  var cy = Math.cos(fxRad(c.yaw)), sy = Math.sin(fxRad(c.yaw));

function fxProject(c, p) {
  var q = fxToCam(c, p), u = FX_F * q[0] / q[2], v = -FX_F * q[1] / q[2];

function fxMv(m, v) { return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]; }
function fxBasis(p) { var m = [p[0], p[2], p[4], p[1], p[3], p[5], 1, 1, 1]; var v = fxMv(fxAdj(m), [p[6], p[7], 1]); return fxMm(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]); }

  function P(a, b) { return fxProject(c, [O[0] + (U[0]*a + V[0]*b) * s, O[1] + (U[1]*a + V[1]*b) * s, O[2] + (U[2]*a + V[2]*b) * s]); }
  var q = [P(0, 0), P(w, 0), P(0, h), P(w, h)];

    if (!big) s.push('<text x="' + (x + 8) + '" y="' + (B + 76) + '" font-family="Space Mono" font-size="24" letter-spacing="1" fill="' + ink + '0.5)">' + GX_MO[m] + '</text>');
